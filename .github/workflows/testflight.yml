name: TestFlight

# Archives the Mac App Store edition (with its widget) and uploads it to App Store Connect.
# Apple then processes the build for TestFlight (usually 10–30 minutes). This workflow does not
# submit the app for App Store review.
#
# Trigger: push a commit whose message contains "[testflight]", push a tag named testflight-<anything>,
#          or run it from Actions → TestFlight → Run workflow (once this file is on the default branch).
#
# Versioning (do not generate these in CI):
#   Marketing version (CFBundleShortVersionString) is the semver in the VERSION file, e.g. 1.1.0.
#   Build number (CFBundleVersion) is CURRENT_PROJECT_VERSION in Xcode/project.yml. It must be a
#   short sequential integer (1, 2, 3, …), never a timestamp or date. Bump that integer in a commit
#   before the next upload, and only after App Store Connect has no equal or higher build for this
#   marketing version.
#
# Required repository secrets (Settings → Secrets and variables → Actions):
#   ASC_KEY_ID         App Store Connect API key ID
#   ASC_ISSUER_ID      Issuer ID shown above the key list in App Store Connect → Users and Access → Integrations
#   ASC_KEY_P8         the AuthKey .p8 PEM, or base64 of that file
# The key needs the Admin role so Xcode can create the cloud-managed distribution certificate
# and provisioning profiles (app + widget) automatically.
#
# Runs on the self-hosted Mac runner (labels: self-hosted, macOS). Never a
# GitHub-hosted runner.

on:
  push:
    branches: ["**"]
    tags: ["testflight-*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  upload:
    if: >-
      github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/testflight-') ||
      contains(github.event.head_commit.message, '[testflight]')
    runs-on: [self-hosted, macOS]
    defaults:
      run:
        shell: bash
    env:
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
    steps:
      - name: Check secrets
        run: |
          missing=()
          for v in ASC_KEY_ID ASC_ISSUER_ID ASC_KEY_P8; do [[ -n "${!v}" ]] || missing+=("$v"); done
          if (( ${#missing[@]} )); then
            echo "::error::Missing repository secrets: ${missing[*]}. See the header of .github/workflows/testflight.yml."
            exit 1
          fi
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Homebrew on PATH
        run: echo "/opt/homebrew/bin:/usr/local/bin:/Applications/Xcode.app/Contents/Developer/usr/bin" >> "$GITHUB_PATH"
      - name: Tests
        run: swift test
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: API key
        run: |
          keyfile="$RUNNER_TEMP/AuthKey.p8"
          raw="$ASC_KEY_P8"
          # The secret may be the .p8 PEM itself, or base64 of that file.
          # Decoding a PEM again yields DER that openssl cannot sign with.
          if printf '%s' "$raw" | grep -q "BEGIN .*PRIVATE KEY"; then
            printf '%s\n' "$raw" > "$keyfile"
          else
            printf '%s' "$raw" | tr -d '[:space:]' | base64 --decode > "$RUNNER_TEMP/key.decoded"
            if grep -q "BEGIN .*PRIVATE KEY" "$RUNNER_TEMP/key.decoded"; then
              mv "$RUNNER_TEMP/key.decoded" "$keyfile"
            else
              {
                echo "-----BEGIN PRIVATE KEY-----"
                base64 < "$RUNNER_TEMP/key.decoded"
                echo "-----END PRIVATE KEY-----"
              } > "$keyfile"
            fi
          fi
          if ! grep -q "BEGIN .*PRIVATE KEY" "$keyfile"; then
            echo "::error::ASC_KEY_P8 is not a PEM private key and not base64 of one. The key was not printed."
            exit 1
          fi
          if ! openssl pkey -in "$keyfile" -noout >/dev/null 2>"$RUNNER_TEMP/pkey.err"; then
            echo "::error::ASC_KEY_P8 could not be parsed as a private key. Store the AuthKey .p8 PEM, or base64 of that file. The key was not printed."
            exit 1
          fi
          echo "AUTH=-allowProvisioningUpdates -authenticationKeyPath $keyfile -authenticationKeyID $ASC_KEY_ID -authenticationKeyIssuerID $ASC_ISSUER_ID" >> "$GITHUB_ENV"
      - name: Inspect latest Apple build
        run: |
          VERSION="$(tr -d '[:space:]' < VERSION)"
          BUILD="$(awk -F'"' '/^[[:space:]]*CURRENT_PROJECT_VERSION:/ { print $2; exit }' Xcode/project.yml)"
          python3 scripts/asc_latest_build.py check \
            --key "$RUNNER_TEMP/AuthKey.p8" \
            --key-id "$ASC_KEY_ID" \
            --issuer "$ASC_ISSUER_ID" \
            --bundle-id com.tweetso.macmonitor \
            --marketing "$VERSION" \
            --build "$BUILD" | tee "$RUNNER_TEMP/asc-builds.json"
          echo "Apple build check:" >> "$GITHUB_STEP_SUMMARY"
          cat "$RUNNER_TEMP/asc-builds.json" >> "$GITHUB_STEP_SUMMARY"
      - name: Archive
        run: |
          cd Xcode && xcodegen generate
          VERSION="$(tr -d '[:space:]' < ../VERSION)"
          case "$VERSION" in
            [0-9]*.[0-9]*.[0-9]*) ;;
            *) echo "::error::Marketing version must be semver MAJOR.MINOR.PATCH (VERSION file is '$VERSION')."; exit 1 ;;
          esac
          IFS=. read -r major minor patch extra <<< "$VERSION"
          if [[ -n "${extra:-}" || ! "$major" =~ ^([0-9]|[1-9][0-9]+)$ || ! "$minor" =~ ^([0-9]|[1-9][0-9]+)$ || ! "$patch" =~ ^([0-9]|[1-9][0-9]+)$ ]]; then
            echo "::error::Marketing version must be semver MAJOR.MINOR.PATCH with no leading zeros (VERSION file is '$VERSION')."
            exit 1
          fi
          BUILD="$(awk -F'"' '/^[[:space:]]*CURRENT_PROJECT_VERSION:/ { print $2; exit }' project.yml)"
          case "$BUILD" in
            ''|*[!0-9]*|0*) bad=1 ;;
            *) bad= ;;
          esac
          if [[ -n "$bad" || ${#BUILD} -gt 4 ]]; then
            echo "::error::CFBundleVersion must be a short sequential integer (1–9999) from Xcode/project.yml CURRENT_PROJECT_VERSION (got '${BUILD:-empty}'). Timestamps and dates are not allowed."
            exit 1
          fi
          echo "Version $VERSION build $BUILD" | tee -a "$GITHUB_STEP_SUMMARY"
          # codesign returns errSecInternalComponent when the runner cannot use
          # the private key. Update the login keychain ACL without printing secrets.
          login_kc="$HOME/Library/Keychains/login.keychain-db"
          if [[ ! -f "$login_kc" ]]; then
            login_kc="$HOME/Library/Keychains/login.keychain"
          fi
          echo "Signing keychain: $login_kc"
          security list-keychains -d user -s "$login_kc"
          security default-keychain -d user -s "$login_kc"
          security set-keychain-settings -lut 21600 "$login_kc" || true
          security find-identity -v -p codesigning "$login_kc" | sed -E 's/^[ ]*[0-9]+\) [0-9A-F]+ //'
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s "$login_kc" </dev/null \
            || echo "::warning::Could not update the key partition list. codesign may return errSecInternalComponent."
          # Do not pass CODE_SIGN_IDENTITY or a provisioning profile. Those settings
          # apply to every target, including SwiftPM packages, and conflict with
          # automatic development signing. exportArchive re-signs for the App Store.
          xcodebuild -project MacMonitor.xcodeproj -scheme MacMonitorAppStore -configuration Release \
            -destination 'generic/platform=macOS' -archivePath "$RUNNER_TEMP/MacMonitor.xcarchive" \
            CODE_SIGN_STYLE=Automatic DEVELOPMENT_TEAM=NWPTRYJ9FL \
            MARKETING_VERSION="$VERSION" CURRENT_PROJECT_VERSION="$BUILD" $AUTH archive > archive.log 2>&1 \
            || { set +e +o pipefail; echo "::group::archive log"; grep -nE "error:|fatal error|ARCHIVE FAILED|CodeSign|errSec|provision|certificate|No profiles|No Accounts" archive.log | head -80; echo "----- tail -----"; tail -n 80 archive.log; echo "::endgroup::"; exit 1; }
      - name: Upload to App Store Connect
        run: |
          cd Xcode
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/MacMonitor.xcarchive" \
            -exportOptionsPlist ExportOptions.plist -exportPath "$RUNNER_TEMP/export" $AUTH > export.log 2>&1 \
            || { set +e +o pipefail; echo "::group::export log"; grep -niE "error|invalid|missing|provision|certificate" export.log | head -80; echo "----- tail -----"; tail -n 80 export.log; echo "::endgroup::"; exit 1; }
          tail -n 15 export.log
          echo "Uploaded to TestFlight processing. This did not submit the app for App Store review." >> "$GITHUB_STEP_SUMMARY"
