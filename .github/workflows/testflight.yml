name: TestFlight

# Archives the Mac App Store edition (with its widget) and uploads it to App Store Connect, where it
# appears in TestFlight after Apple finishes processing (usually 10–30 minutes).
#
# Trigger: push a commit whose message contains "[testflight]", push a tag named testflight-<anything>,
#          or run it from Actions → TestFlight → Run workflow (once this file is on the default branch).
#
# Required repository secrets (Settings → Secrets and variables → Actions):
#   ASC_KEY_ID         App Store Connect API key ID
#   ASC_ISSUER_ID      Issuer ID shown above the key list in App Store Connect → Users and Access → Integrations
#   ASC_KEY_P8         base64 of the downloaded AuthKey_XXXX.p8  (base64 -i AuthKey_XXXX.p8 | pbcopy)
# The key needs the Admin role so Xcode can create the cloud-managed distribution certificate
# and provisioning profiles (app + widget) automatically.

on:
  push:
    branches: ["**"]
    tags: ["testflight-*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  upload:
    if: >-
      github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/testflight-') ||
      contains(github.event.head_commit.message, '[testflight]')
    runs-on: macos-15
    defaults:
      run:
        shell: bash
    env:
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
    steps:
      - name: Check secrets
        run: |
          missing=()
          for v in ASC_KEY_ID ASC_ISSUER_ID ASC_KEY_P8; do [[ -n "${!v}" ]] || missing+=("$v"); done
          if (( ${#missing[@]} )); then
            echo "::error::Missing repository secrets: ${missing[*]}. See the header of .github/workflows/testflight.yml."
            exit 1
          fi
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Tests
        run: swift test
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: API key
        run: |
          echo "$ASC_KEY_P8" | base64 --decode > "$RUNNER_TEMP/AuthKey.p8"
          echo "AUTH=-allowProvisioningUpdates -authenticationKeyPath $RUNNER_TEMP/AuthKey.p8 -authenticationKeyID $ASC_KEY_ID -authenticationKeyIssuerID $ASC_ISSUER_ID" >> "$GITHUB_ENV"
      - name: Archive
        run: |
          cd Xcode && xcodegen generate
          VERSION="$(cat ../VERSION)"
          BUILD="$(date -u +%y%m%d%H%M)"          # always increasing, unique per upload
          echo "Version $VERSION build $BUILD" | tee -a "$GITHUB_STEP_SUMMARY"
          xcodebuild -project MacMonitor.xcodeproj -scheme MacMonitorAppStore -configuration Release \
            -destination 'generic/platform=macOS' -archivePath "$RUNNER_TEMP/MacMonitor.xcarchive" \
            MARKETING_VERSION="$VERSION" CURRENT_PROJECT_VERSION="$BUILD" $AUTH archive > archive.log 2>&1 \
            || { grep -E "error:|requires a provisioning|No profiles|No Accounts|certificate" archive.log | head -60; tail -n 40 archive.log; exit 1; }
      - name: Upload to App Store Connect
        run: |
          cd Xcode
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/MacMonitor.xcarchive" \
            -exportOptionsPlist ExportOptions.plist -exportPath "$RUNNER_TEMP/export" $AUTH > export.log 2>&1 \
            || { grep -iE "error|invalid|missing" export.log | head -60; tail -n 40 export.log; exit 1; }
          tail -n 15 export.log
          echo "Uploaded. The build shows up in App Store Connect → TestFlight after processing." >> "$GITHUB_STEP_SUMMARY"
